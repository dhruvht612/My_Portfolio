name: CI

on:
  pull_request:
  push:
    branches: [main, redesign]

# A new push to a branch cancels the run still in flight for it. Without this,
# a burst of commits queues a full run each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # lint:ci pins --max-warnings so the known backlog cannot grow. Errors are
      # already zero; see the rule notes in eslint.config.js.
      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test:run

      # Fork pull requests do not receive secrets. The build still succeeds —
      # PortfolioContext falls back to the bundled static slice — it just exercises
      # a different path than production. Do not switch to pull_request_target to
      # work around this; that hands repo secrets to unreviewed code.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}

      # Also scans dist/ for a leaked service-role key and fails hard if one is found.
      # --print-seed logs the baseline this build would set, so accepting a size change is
      # a copy out of this log rather than a re-run somewhere else.
      #
      # Without the Supabase env the build is a different artifact, not a smaller one:
      # createClient becomes unreachable, @supabase/supabase-js tree-shakes out, and the
      # chunk graph reshuffles around the ~70 kB gap. Those sizes cannot be held against a
      # baseline seeded from a configured build, so report instead of failing when the
      # secret is absent — as it is on fork PRs, and on this repo until it is set. The
      # service-role key scan still hard-fails either way.
      - name: Bundle budget and secret scan
        run: npm run size -- --print-seed ${{ secrets.VITE_SUPABASE_URL == '' && '--report-only' || '' }}

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
